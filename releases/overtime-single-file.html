/* src/renderer/styles.css
 * ---------------------------------------------------------------------------
 * The whole look: a translucent pill with big tabular numerals that scale with
 * the window (vmin units + the aspect lock in main.js mean the content always
 * fills the frame). Controls fade in on hover; everything's see-through at the
 * corners so the rounded-pill shape reads over any screen content.

 * v2: the pill color, text color, typeface and ARRANGEMENT are all settings.
 * They arrive as CSS custom properties (--bg-rgb, --pill-opacity, --text-color,
 * --font) and the [data-layout] attribute, all set by settings-apply.js. The
 * tabbed settings panel (bottom of this file) overlays the pill on demand.
 * ------------------------------------------------------------------------- */

:root {
  /* Overwritten at runtime by applySettings(); these are the defaults = the
   * original look (black pill, white numerals, system font, stacked layout). */

  --pill-opacity: 1;
  --text-color: #ffffff;
  --font: -apple-system, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;

  /* Per-layout readout sizes, as em multiples of #face's fixed base font-size
   * (the 'stack' defaults). app.js scales the whole face to fill the pill, so
   * these are window-INDEPENDENT ratios, not absolute sizes. */

  --merid-size: 1em;
  --sw-size: 2em;
  --face-gap: 0em;
}

/* Transparent everywhere so the OS window's see-through corners show. */
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

 * translucent background is the only visible surface when idle. */
#app {
  position: fixed;
  inset: 0;
  border-radius: 6vmin;
  background: rgba(var(--bg-rgb), var(--pill-opacity));
  color: var(--text-color);
  font-family: var(--font);
  font-variant-numeric: tabular-nums; /* digits don't jiggle as they change */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  overflow: hidden;
  /* Grab ANY empty area of the pill to move the window. Every interactive
   * child (buttons, grip, panel controls) sets no-drag so clicks still land. */

 * child (buttons, grip, panel) opts back out with no-drag. */

  justify-content: center;

  flex-direction: column;
  gap: var(--face-gap);
  line-height: 1;
  /* Fixed "design" base size (the layout sizes below are em multiples of this).
   * app.js measures the face's natural box and applies transform: scale() so the
   * content FILLS the pill (minus padding). We deliberately no longer size in

   * tiny in a short-wide window. No transition on transform (it's set every tick/
   * resize and would otherwise animate/jank). */

// -----------------------------------------------------------------------------
// One API, two environments. The rest of the renderer (app.js) never touches
// window.episodeTimer or localStorage directly — it goes through
// window.EpisodeTimerBridge, which looks identical whether we're running inside
// Electron or as a plain browser tab (the single-file build).

//   Browser   -> a localStorage-backed fallback using the SAME shared schema,

//                are meaningless in a tab). always-on-top / frameless / resize /
//                quit don't exist in a browser, so those degrade to no-ops and

      pushTimer: function (t) { api.pushTimer(t); },
      getSettings: function () { return api.getSettings(); },
      setSettings: function (partial) { return api.setSettings(partial); },

  }

  function renderStopwatch(now) {
    var text = fmt.formatElapsed(sw.elapsedMs(state, now));
    els.stopwatch.textContent = text;
    if (els.spStopwatch) els.spStopwatch.textContent = text; // live preview
  }

  function renderButtons() {
    setDisabled(els.btnPlay, !sw.canPlay(state));
    setDisabled(els.btnPause, !sw.canPause(state));
    setDisabled(els.btnReset, !sw.canReset(state));
  }

  function setDisabled(el, disabled) {
    if (disabled) el.setAttribute('disabled', '');
    else el.removeAttribute('disabled');
  }

  // Full render: clock, stopwatch, status attribute, button states.
  function render() {
    var now = Date.now();
    renderClock(now);
    renderStopwatch(now);
    els.app.setAttribute('data-status', state.status);
    renderButtons();
    fitFace(); // the text may have changed width (seconds/meridiem/digits) -> refit
  }

  // --- fit-to-fill ------------------------------------------------------------
  // The face is sized at a fixed design base (CSS), then scaled here so it FILLS
  // the pill (minus a small margin), using whichever axis is the binding
  // constraint. This is what makes a short-wide window show a big wide clock
  // instead of tiny vmin-collapsed text. offsetWidth/Height report the UNSCALED
  // layout size (transforms don't affect them), so repeated fits are stable and
  // there's no feedback loop with the ResizeObserver on #app.
  var MIN_PAD = 6; // px — text never touches the edges
  function fitFace() {
    if (!els.face || !els.app) return;
    var natW = els.face.offsetWidth;
    var natH = els.face.offsetHeight;
    if (!natW || !natH) return;
    var cw = els.app.clientWidth;
    var ch = els.app.clientHeight;
    if (!cw || !ch) return;
    // ~6% of the smaller dimension, but always at least MIN_PAD px per side.
    var pad = Math.max(MIN_PAD, Math.round(Math.min(cw, ch) * 0.06));
    var availW = Math.max(1, cw - pad * 2);
    var availH = Math.max(1, ch - pad * 2);
    var scale = Math.min(availW / natW, availH / natH);
    if (!isFinite(scale) || scale <= 0) return;
    els.face.style.transform = 'scale(' + scale + ')';
  }

  // --- the second-aligned tick -----------------------------------------------
  // Re-arm each tick so minute flips (and HH:MM:SS seconds) land right on the
  // second boundary rather than drifting. Elapsed is always recomputed from the
  // anchor, so a late/throttled tick costs display latency only, never drift.
  function scheduleTick() {
    if (tickHandle) clearTimeout(tickHandle);
    var delay = 1000 - (Date.now() % 1000) + 5;
    tickHandle = setTimeout(function () {
      render();
      // While running, keep the saved value fresh (<=1s stale on a hard kill).
      if (state.status === 'running') persistTimer();
      scheduleTick();
    }, delay);
  }

  // --- transitions (button handlers) -----------------------------------------
  // Each applies a pure transition; if the state object actually changed we
  // re-render and persist. No-ops (same object) are cheaply skipped.
  function applyTransition(next) {
    if (next === state) return; // identity -> nothing changed
    state = next;
    render();
    persistTimer();
  }

  function wireButtons() {
    els.btnPlay.addEventListener('click', function () { applyTransition(sw.play(state, Date.now())); });
    els.btnPause.addEventListener('click', function () { applyTransition(sw.pause(state, Date.now())); });
    els.btnReset.addEventListener('click', function () { applyTransition(sw.reset(state, Date.now())); });
    els.btnQuit.addEventListener('click', function () { bridge.quit(); });
  }

  // --- hover reveal -----------------------------------------------------------
  // enter/leave on the document element toggle data-hover; CSS does the fade +
  // the slight shrink of the readouts. (Known Electron quirk: elements under
  // -webkit-app-region: drag can swallow mousemove, but enter/leave on the
  // document still fire in practice. FALLBACK: see PLAN §2.6 — main can poll
  // screen.getCursorScreenPoint() and send a hover event if this proves flaky.)
  function wireHover() {
    var docEl = document.documentElement;
    docEl.addEventListener('mouseenter', function () { els.app.setAttribute('data-hover', 'true'); });
    docEl.addEventListener('mouseleave', function () { els.app.setAttribute('data-hover', 'false'); });
  }

  // --- resize grip ------------------------------------------------------------
  // Electron only. Because the window moves under the cursor as it grows, client
  // coordinates are useless — we use screenX/screenY deltas and let main honor
  // the larger delta against the aspect lock.
  function wireGrip() {
    if (bridge.env !== 'electron') return; // hidden in browser mode anyway
    var dragging = false;
    var lastX = 0;
    var lastY = 0;

    els.grip.addEventListener('pointerdown', function (e) {
      dragging = true;
      lastX = e.screenX;
      lastY = e.screenY;
      try { els.grip.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    els.grip.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.screenX - lastX;
      var dy = e.screenY - lastY;
      lastX = e.screenX;
      lastY = e.screenY;
      if (dx || dy) bridge.resizeBy(dx, dy);
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      try { els.grip.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    els.grip.addEventListener('pointerup', endDrag);
    els.grip.addEventListener('pointercancel', endDrag);
  }

  // --- settings ---------------------------------------------------------------
  function applyAndRemember(settings) {
    settingsMod.applySettings(settings, document.documentElement, els.app);
    if (panel) panel.reflect(settings); // keep the panel's highlights in sync
    render(); // hour12/showSeconds may have changed -> redraw the clock
  }

  // Build + wire the tabbed settings panel. A click on any option persists the
  // single changed key through the SAME settings path (Electron IPC or browser
  // localStorage); the normalized result comes back and we apply it live.
  function setupPanel() {
    if (!panelMod) return; // defensive: panel script failed to load
    panel = panelMod.init({
      appEl: els.app,
      gearEl: els.btnSettings,
      onSelect: function (key, value) {
        var patch = {};
        patch[key] = value;
        Promise.resolve(bridge.setSettings(patch)).then(function (settings) {
          applyAndRemember(settings);
        });
      },
      // Let main grow the window for comfortable editing and restore it on close
      // (Electron only; a no-op in browser mode).
      onToggle: function (open) {
        if (bridge.setSettingsOpen) bridge.setSettingsOpen(open);
      }
    });

    // The panel built its live-preview clone; cache its spans so render() can
    // keep them ticking with the real clock + stopwatch values.
    els.spTime = document.getElementById('sp-time');
    els.spMeridiem = document.getElementById('sp-meridiem');
    els.spStopwatch = document.getElementById('sp-stopwatch');
    render(); // paint the preview immediately with the current values
  }

  // Tray -> renderer wiring (Electron only; browser bridge no-ops). The tray's
  // Play/Pause/Reset run through the SAME applyTransition path as the on-pill
  // buttons (renderer owns the state), and "Settings…" opens the panel.
  function wireTray() {
    if (bridge.onTimerCommand) {
      bridge.onTimerCommand(function (action) {
        var now = Date.now();
        if (action === 'play') applyTransition(sw.play(state, now));
        else if (action === 'pause') applyTransition(sw.pause(state, now));
        else if (action === 'reset') applyTransition(sw.reset(state, now));
      });
    }
    if (bridge.onOpenSettings) {
      bridge.onOpenSettings(function () { if (panel) panel.open(); });
    }
  }

  // Refit whenever the pill changes size (user drag-resize, grip, settings grow,
  // display scaling). ResizeObserver is ideal; fall back to window 'resize'.
  function wireFit() {
    if (typeof root.ResizeObserver === 'function') {
      var ro = new root.ResizeObserver(function () { fitFace(); });
      ro.observe(els.app);
    } else if (root.addEventListener) {
      root.addEventListener('resize', fitFace);
    }
    fitFace();
  }

  // --- test / debug hook (read-only), PLAN §2.5 ------------------------------
  function installDebugHook() {
    root.__episodeTimer = {
      getState: function () { return { status: state.status, accumulatedMs: state.accumulatedMs, runningSince: state.runningSince }; },
      elapsedMs: function () { return sw.elapsedMs(state, Date.now()); },
      getSettings: function () { return settingsMod.getClockOptions(); },
      env: bridge.env
    };
  }

  // --- boot -------------------------------------------------------------------
  function boot() {
    cacheEls();

    // Mark the environment so CSS can hide Electron-only affordances (× + grip)
    // in browser mode.
    els.app.setAttribute('data-env', bridge.env);

    wireButtons();
    wireHover();
    wireGrip();
    setupPanel();
    wireTray();
    installDebugHook();
    wireFit();

    // Re-render immediately when the tab/window becomes visible again (a hidden
    // page may have been throttled; backgroundThrottling:false covers Electron).
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) render();
    });

    // Load persisted settings + timer, then start ticking.
    Promise.resolve(bridge.getSettings()).then(function (settings) {
      applyAndRemember(settings);
    });

    bridge.onSettingsChanged(function (settings) {
      applyAndRemember(settings);
    });

    Promise.resolve(bridge.getTimer()).then(function (persisted) {
      state = sw.fromPersisted(persisted); // restore-as-paused (D6)
      render();
      scheduleTick();
    });

    // First paint even before the async settings/timer resolve.
    render();
    scheduleTick();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}(typeof self !== 'undefined' ? self : this));

</script>
</body>
</html>
